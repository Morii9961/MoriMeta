# cargo-deny (SECURITY_MODEL §11, RELEASE_PLAN §7.2): licenses, RustSec advisories, sources.
# One policy for both Cargo workspaces (the core at the root, the app in apps/desktop/src-tauri):
#   cargo deny check
#   cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check --config deny.toml

[graph]
# MoriMeta 1.0 ships for Windows x64 only (DECISIONS D-11); crates only other platforms use
# (gtk/glib for Linux, the macOS frameworks) are not part of the build and not judged here.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# every RustSec vulnerability fails the check; an unmaintained crate only when MoriMeta itself
# depends on it directly (the rest is reported upstream)
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# permissive licenses compatible with GPL-3.0-or-later, plus MoriMeta's own license;
# MPL-2.0 is file-level copyleft and GPL-3.0 compatible (its source is on crates.io)
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# the same list serves both workspaces; each uses only some of these
unused-allowed-license = "allow"

[bans]
# Tauri brings several versions of some crates; duplicates are tolerated, not wanted
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
