[package]
name = "exiftool-session"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
rand = "0.10.3"
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_LibraryLoader", "Win32_System_IO"] }
