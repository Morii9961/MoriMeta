# RELEASE_PLAN §10 step 1: watch exiftool.org for releases newer than the pinned ExifTool and open
# an issue for each new one, marked when ExifTool's history calls it a security update (that starts
# the 14-day SLA). Reads two public pages; changes nothing in the repository.
name: exiftool-watch

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: newer ExifTool release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compare with research/exiftool.lock.json
        id: watch
        run: |
          set -o pipefail
          python tools/exiftool_watch.py --issue "$RUNNER_TEMP/issue.md" | tee "$RUNNER_TEMP/out.txt"
          if [ -f "$RUNNER_TEMP/issue.md" ]; then
            echo "title=$(tail -n 1 "$RUNNER_TEMP/out.txt")" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue (once per version)
        if: steps.watch.outputs.title != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.watch.outputs.title }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$TITLE\" in:title" --json title --jq "map(select(.title == env.TITLE)) | length")
          if [ "$existing" != "0" ]; then
            echo "already tracked: $TITLE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
