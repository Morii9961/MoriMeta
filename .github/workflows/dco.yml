# Every commit of a pull request carries a Developer Certificate of Origin sign-off
# (CONTRIBUTING.md). Commits by bots (Dependabot) are exempt.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format='%B' "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $c by $author has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing
