# Checks for every push to main and every pull request (docs/REPOSITORY_CHECKLIST.md §2, P-8).
# Actions are pinned to commit SHAs; the token can only read the repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: fmt, clippy, tests (pinned ExifTool)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Repository inclusion check (all tracked files)
        run: git ls-files -z | xargs -0 python tools/check_repo.py

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: research/.work/exiftool
          key: exiftool-${{ hashFiles('research/exiftool.lock.json') }}

      - name: Pinned ExifTool (SHA-256 verified against the lock file)
        run: python research/scripts/fetch_exiftool.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: exFAT test volume (64 MB VHD for files_on_an_exfat_drive_are_not_written)
        # best effort: without it that test is skipped
        continue-on-error: true
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'mm-exfat.vhdx'
          $script = Join-Path $env:RUNNER_TEMP 'mm-exfat.txt'
          @"
          create vdisk file="$vhd" maximum=64 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          create partition primary
          format fs=exfat quick label=MMEXFAT
          assign letter=X
          "@ | Set-Content -Encoding ascii $script
          diskpart /s $script
          if (Test-Path 'X:\') { 'MM_E2E_EXFAT_VOLUME=X:\' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }

      - name: SMB share over localhost (photos_on_a_network_share_through_write_crash_and_undo)
        # best effort: without it that test is skipped
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'C:\mm-smb' | Out-Null
          New-SmbShare -Name mmsmb -Path 'C:\mm-smb' -FullAccess Everyone | Out-Null
          if (Test-Path '\\localhost\mmsmb') { 'MM_E2E_SMB_DIR=\\localhost\mmsmb' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }

      - name: Tests
        # the runner is elevated; MoriMeta refuses to write then (SECURITY_MODEL §4.1)
        env:
          MM_ALLOW_ELEVATED: "1"
        run: cargo test --workspace --locked

  msrv:
    name: minimum Rust version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain from rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked
