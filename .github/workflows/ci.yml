# Checks for every push to main and every pull request (docs/REPOSITORY_CHECKLIST.md §2, P-8).
# Actions are pinned to commit SHAs; the token can only read the repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: fmt, clippy, tests (pinned ExifTool)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Repository inclusion check (all tracked files)
        run: git ls-files -z | xargs -0 python tools/check_repo.py

      - name: Every backend text has a Chinese translation (apps/desktop/src/i18n/backend.zh.json)
        run: python tools/message_inventory.py --check apps/desktop/src/i18n/backend.zh.json

      - name: Architecture rules (dependency direction, pure mm-domain, the frontend's permissions)
        run: python tools/check_architecture.py

      - name: The UI's IPC types match the Rust structs they mirror
        run: python tools/check_ipc_types.py

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: research/.work/exiftool
          key: exiftool-${{ hashFiles('research/exiftool.lock.json') }}

      - name: Pinned ExifTool (SHA-256 verified against the lock file)
        run: python research/scripts/fetch_exiftool.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Docs (broken intra-doc links and HTML in doc comments)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

      - name: exFAT and FAT32 test volumes (256 MB VHDs for files_on_an_exfat / a_fat32_drive_are_not_written)
        # best effort: without them those tests are skipped
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($v in @(@('exfat', 'X', 'MM_E2E_EXFAT_VOLUME'), @('fat32', 'Y', 'MM_E2E_FAT32_VOLUME'))) {
            $fs, $letter, $var = $v
            $vhd = Join-Path $env:RUNNER_TEMP "mm-$fs.vhdx"
            $script = Join-Path $env:RUNNER_TEMP "mm-$fs.txt"
            @(
              "create vdisk file=`"$vhd`" maximum=256 type=expandable",
              "select vdisk file=`"$vhd`"",
              'attach vdisk',
              'create partition primary',
              "format fs=$fs quick label=MM$($fs.ToUpper())",
              "assign letter=$letter"
            ) | Set-Content -Encoding ascii $script
            diskpart /s $script
            if (Test-Path "$($letter):\") { "$var=$($letter):\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }

      - name: SMB share over localhost (photos_on_a_network_share_through_write_crash_and_undo)
        # best effort: without it that test is skipped
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'C:\mm-smb' | Out-Null
          New-SmbShare -Name mmsmb -Path 'C:\mm-smb' -FullAccess Everyone | Out-Null
          if (Test-Path '\\localhost\mmsmb') { 'MM_E2E_SMB_DIR=\\localhost\mmsmb' | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }

      - name: Tests
        # the runner is elevated; MoriMeta refuses to write then (SECURITY_MODEL §4.1)
        env:
          MM_ALLOW_ELEVATED: "1"
        run: cargo test --workspace --locked

  desktop:
    name: desktop app (frontend build, adapter tests)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/desktop/src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Frontend (type check, build)
        # Node comes with the runner image; npm ci installs exactly package-lock.json
        working-directory: apps/desktop
        run: |
          node --version
          npm ci --no-fund --no-audit
          npm audit --audit-level=moderate
          npm run build
          npm test

      - name: Adapter and release helper (format, clippy, tests)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: Release files the installer ships with (third-party notices, SBOM)
        # what release.yml makes at a tag; every shipped component needs a license and a hash
        run: |
          python tools/third_party_notices.py --check --out "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md"
          python tools/sbom.py --check --out "$RUNNER_TEMP/sbom.cdx.json"

  deps:
    # SECURITY_MODEL §11: licenses (GPL-3.0-or-later compatible), RustSec advisories and crate
    # sources for what the Windows build ships (deny.toml); the action runs in a Linux container
    name: dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Core workspace
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: ""

      - name: Desktop app workspace
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --config deny.toml

  msrv:
    name: minimum Rust version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain from rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          echo "MSRV $msrv"
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --workspace --all-targets --locked
